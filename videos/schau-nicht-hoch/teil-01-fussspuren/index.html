<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <script src="assets/figure.js"></script>
    <style>
      @font-face { font-family: "Archivo Black"; src: url("assets/fonts/archivo-black-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-style: normal; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin-700-normal.woff2") format("woff2"); font-weight: 700; font-style: normal; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin-900-normal.woff2") format("woff2"); font-weight: 900; font-style: normal; }
      :root {
        --ground: #070b14;
        --ink: #ffffff;
        --accent: #ffe14d;
        --alert: #ff3b3b;
        --ok: #1b8a4b;
        --snow: #dfe8f5;
        --font-display: "Archivo Black", sans-serif;
        --font-ui: "Inter", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root {
        position: relative; width: 1080px; height: 1920px; overflow: hidden;
        background: var(--ground); font-family: var(--font-ui); color: var(--ink);
      }
      .clip { position: absolute; inset: 0; }
      .scene { z-index: 1; }
      #hud { z-index: 20; }
      #labels { z-index: 20; }
      #captions { z-index: 30; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1080"
      data-height="1920"
    >
      <div id="s1-titel" class="clip scene" data-composition-id="s1-titel" data-composition-src="compositions/s1-titel.html" data-start="0.00" data-duration="2.00" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="s2-schlafzimmer" class="clip scene" style="z-index:2" data-composition-id="s2-schlafzimmer" data-composition-src="compositions/s2-schlafzimmer.html" data-start="2.00" data-duration="4.80" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="s3-hof" class="clip scene" data-composition-id="s3-hof" data-composition-src="compositions/s3-hof.html" data-start="6.30" data-duration="4.30" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="s4-flur" class="clip scene" data-composition-id="s4-flur" data-composition-src="compositions/s4-flur.html" data-start="10.60" data-duration="3.00" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="s5-schloss" class="clip scene" data-composition-id="s5-schloss" data-composition-src="compositions/s5-schloss.html" data-start="13.60" data-duration="3.10" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="s6-treppenhaus" class="clip scene" data-composition-id="s6-treppenhaus" data-composition-src="compositions/s6-treppenhaus.html" data-start="16.70" data-duration="2.40" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="s7-decke" class="clip scene" data-composition-id="s7-decke" data-composition-src="compositions/s7-decke.html" data-start="19.10" data-duration="6.40" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="s8-abspann" class="clip scene" data-composition-id="s8-abspann" data-composition-src="compositions/s8-abspann.html" data-start="25.50" data-duration="4.50" data-track-index="1" data-width="1080" data-height="1920"></div>
      <!-- HUD: Serientag, Uhrzeit, Wasserzeichen (Teilkomposition) -->
      <div id="hud" class="clip" data-composition-id="hud" data-composition-src="compositions/hud.html" data-start="0" data-duration="30" data-track-index="2" data-width="1080" data-height="1920"></div>

      <!-- Ortslabel: wechselt pro Szene (Teilkomposition) -->
      <div id="labels" class="clip" data-composition-id="labels" data-composition-src="compositions/labels.html" data-start="0" data-duration="30" data-track-index="3" data-width="1080" data-height="1920"></div>

      <!-- Untertitel: eine Gruppe pro Sprechsegment (Teilkomposition) -->
      <div id="captions" class="clip" data-composition-id="captions" data-composition-src="compositions/captions.html" data-track-kind="captions" data-start="0" data-duration="30" data-track-index="4" data-width="1080" data-height="1920"></div>

      <!-- Tonspur: Wind-Bett (bearbeitet), Schläge (deterministisch), Stimme (ab 2,02 s) -->
      <audio id="sfx" src="assets/sfx-bed.wav" data-start="0" data-duration="30" data-volume="0.45"></audio>
      <audio id="hits" src="assets/hits.wav" data-start="0" data-duration="30" data-volume="1"></audio>
      <audio id="voice" src="assets/voice-timed.wav" data-start="0" data-duration="30" data-volume="1"></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
